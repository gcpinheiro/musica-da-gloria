services:
  musica-da-gloria:
    build:
      context: .
      dockerfile: Dockerfile
    image: musica-da-gloria:local
    init: true
    ports:
      - "${WEB_PORT:-4201}:4201"
    environment:
      NODE_ENV: production
      PORT: 4201
      API_ORIGIN: ${API_ORIGIN:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4201/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
