services:
  musica-da-gloria:
    build:
      context: .
      dockerfile: Dockerfile
    image: musica-da-gloria:local
    init: true
    ports:
      - "4200:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
